<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホの画面幅に合わせて表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>かんたんメモ帳</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📝 かんたんメモ帳</h1>
  </header>

  <main>
    <!-- メモを書く場所 -->
    <section class="editor">
      <textarea id="memo-input" placeholder="ここにメモを書いてください"></textarea>
      <div class="buttons">
        <button id="cancel-button" class="secondary" hidden>キャンセル</button>
        <button id="save-button">保存</button>
      </div>
    </section>

    <!-- 保存したメモの一覧 -->
    <section>
      <h2>保存したメモ（<span id="memo-count">0</span>件）</h2>
      <p id="empty-message" class="empty">まだメモはありません</p>
      <ul id="memo-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
