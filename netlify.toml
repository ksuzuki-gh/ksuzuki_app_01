# Netlify の設定（GitHub と連携して公開するときに使われる）
# このリポジトリは、作ったファイルをそのまま公開するだけなので、組み立て（ビルド）は不要
[build]
  publish = "."
  command = ""

# えいたんご（eitango/）は別のサイトで公開しているので、このサイトでは開けないようにする
# （「ページが見つかりません」の 404.html を表示する）
[[redirects]]
  from = "/eitango"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/eitango/*"
  to = "/404.html"
  status = 404
  force = true
